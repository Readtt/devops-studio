<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Studio</title>
    <script>
      (function () {
        try {
          // Fast-path theme key — mirrors FAST_PATH_KEY in
          // src/modules/theme/ThemeProvider.tsx. Renamed from
          // "terax-ui-theme-shadow"; existing users see one-time
          // unstyled flash on first launch after this commit, then
          // the new key is populated and the fast-path resumes.
          var t = localStorage.getItem("devops-studio-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.backgroundColor =
            resolved === "dark" ? "#0a0a0a" : "#ffffff";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
